  <style>
/* =========================================================
   مقاضي بيتنا — التصميم
   ========================================================= */

:root {
  --bg: #F2F5F1;
  --surface: #FFFFFF;
  --surface-2: #E9EFEA;
  --ink: #15302A;
  --muted: #687870;
  --line: #DCE4DE;
  --green: #0F6E54;
  --green-ink: #FFFFFF;
  --green-soft: #DDEFE7;
  --board: #0D4A3B;
  --board-ink: #EAF5EF;
  --saffron: #F3B33D;
  --danger: #C8433A;
  --danger-soft: #FBE7E4;
  --shadow-1: 0 1px 0 rgba(21, 48, 42, .04), 0 2px 10px rgba(21, 48, 42, .05);
  --shadow-2: 0 10px 30px rgba(13, 74, 59, .22);
  --scrim: rgba(10, 28, 23, .38);

  --r-sm: 12px;
  --r-md: 16px;
  --r-lg: 24px;

  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --kb: 0px;
  --vvh: 100dvh;

  --font: "Readex Pro", system-ui, -apple-system, "SF Arabic", "Segoe UI", Tahoma, sans-serif;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0E1714;
    --surface: #16221E;
    --surface-2: #1D2B26;
    --ink: #E7F0EB;
    --muted: #8FA199;
    --line: #253530;
    --green: #35B48A;
    --green-ink: #062219;
    --green-soft: #173A2F;
    --board: #123D31;
    --board-ink: #E7F4EE;
    --saffron: #F4BB52;
    --danger: #F0776C;
    --danger-soft: #3A1F1C;
    --shadow-1: 0 1px 0 rgba(0, 0, 0, .25);
    --shadow-2: 0 10px 30px rgba(0, 0, 0, .45);
    --scrim: rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}

*, *::before, *::after { box-sizing: border-box; }
* { -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.5;
  background: var(--bg);
  color: var(--ink);
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
}
body.locked { overflow: hidden; }
[hidden] { display: none !important; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; touch-action: manipulation; }
svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
:focus-visible { outline: 2.5px solid var(--green); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3, p { margin: 0; }

/* ---------- Splash ---------- */
.splash {
  position: fixed; inset: 0; z-index: 100;
  display: grid; place-content: center; justify-items: center; gap: 16px;
  background: var(--bg);
  transition: opacity .35s ease, visibility .35s;
}
.splash.gone { opacity: 0; visibility: hidden; }
.splash-mark img { border-radius: 22px; animation: breathe 1.6s ease-in-out infinite; }
.splash-msg { color: var(--muted); max-width: 280px; text-align: center; font-size: 15px; }
@keyframes breathe { 50% { transform: scale(.94); } }

/* ---------- Login ---------- */
.login {
  min-height: 100dvh;
  display: grid; place-items: center;
  padding: calc(24px + var(--safe-t)) 20px calc(24px + var(--safe-b));
}
.login-card { width: 100%; max-width: 380px; text-align: center; }
.login-logo { border-radius: 22px; box-shadow: var(--shadow-2); }
.login h1 { font-size: 30px; font-weight: 700; margin-top: 18px; letter-spacing: -.3px; }
.login-sub { color: var(--muted); margin-top: 6px; }
.login-form { margin-top: 28px; display: grid; gap: 14px; text-align: start; }
.field { display: grid; gap: 6px; }
.field > span { font-size: 14px; color: var(--muted); font-weight: 500; }
.field input {
  height: 52px; padding: 0 16px;
  border: 1.5px solid var(--line); border-radius: var(--r-md);
  background: var(--surface); font-size: 16px; text-align: left;
}
.field input:focus { outline: none; border-color: var(--green); }
.login-err { min-height: 22px; color: var(--danger); font-size: 14px; }
.demo-login { margin-top: 26px; }
.demo-note { font-size: 14px; color: var(--muted); background: var(--surface-2); border-radius: var(--r-sm); padding: 10px 14px; }
.demo-q { margin-top: 22px; font-weight: 600; }
.demo-users { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
.demo-user {
  display: grid; justify-items: center; gap: 8px;
  padding: 18px 10px; border-radius: var(--r-lg);
  background: var(--surface); box-shadow: var(--shadow-1); border: 1.5px solid var(--line);
  font-weight: 600;
}
.demo-user:active { transform: scale(.97); }

/* ---------- Buttons ---------- */
.btn {
  height: 54px; padding: 0 20px; border-radius: var(--r-md);
  font-weight: 600; font-size: 16px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform .12s ease, background .2s;
}
.btn:active { transform: scale(.98); }
.btn-block { width: 100%; }
.btn-primary { background: var(--green); color: var(--green-ink); }
.btn-primary[disabled] { opacity: .6; }
.btn-soft { background: var(--surface-2); color: var(--ink); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger-soft { background: var(--danger-soft); color: var(--danger); }

.icon-btn {
  width: 42px; height: 42px; border-radius: 50%;
  display: grid; place-items: center; color: var(--ink);
}
.icon-btn:active { background: var(--surface-2); }
.icon-btn.sm { width: 36px; height: 36px; }
.icon-btn.sm svg { width: 20px; height: 20px; }

/* ---------- App shell ---------- */
.app { min-height: 100dvh; }
.topbar {
  position: sticky; top: 0; z-index: 20;
  padding-top: var(--safe-t);
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  -webkit-backdrop-filter: saturate(1.4) blur(14px);
  backdrop-filter: saturate(1.4) blur(14px);
}
.topbar-in {
  max-width: 600px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px 8px 8px;
}
.brand h1 { font-size: 22px; font-weight: 700; letter-spacing: -.2px; }
.greet { font-size: 13.5px; color: var(--muted); }
.top-actions { display: flex; align-items: center; gap: 2px; }

.sync {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--muted);
  padding: 4px 10px; border-radius: 99px; background: var(--surface-2);
  margin-inline-end: 4px;
}
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
.sync[data-state="busy"] i { background: var(--saffron); animation: pulse 1s infinite; }
.sync[data-state="off"] i { background: var(--danger); }
.sync[data-state="demo"] i { background: var(--saffron); }
@keyframes pulse { 50% { opacity: .3; } }

.searchbar { max-width: 600px; margin: 0 auto; padding: 0 14px 10px; }
.search-in {
  display: flex; align-items: center; gap: 8px;
  height: 48px; padding: 0 14px 0 6px;
  background: var(--surface); border-radius: var(--r-md);
  border: 1.5px solid var(--line);
}
.search-in:focus-within { border-color: var(--green); }
.search-in > svg { color: var(--muted); width: 20px; height: 20px; }
.search-in input { flex: 1; border: 0; background: none; height: 100%; font-size: 16px; outline: none; min-width: 0; }
.search-in input::-webkit-search-cancel-button { display: none; }

.wrap {
  max-width: 600px; margin: 0 auto;
  padding: 6px 14px calc(120px + var(--safe-b));
}

/* ---------- Board (summary) ---------- */
.board {
  position: relative; overflow: hidden;
  display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;
  padding: 20px 20px 18px;
  background: var(--board); color: var(--board-ink);
  border-radius: var(--r-lg);
}
.board::after {
  /* نقشة خفيفة تشبه شبك السلة */
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .07;
  background-image:
    repeating-linear-gradient(45deg, currentColor 0 1px, transparent 1px 14px),
    repeating-linear-gradient(-45deg, currentColor 0 1px, transparent 1px 14px);
  -webkit-mask-image: linear-gradient(to left, #000, transparent 65%);
  mask-image: linear-gradient(to left, #000, transparent 65%);
}
.board-main { flex: 1; min-width: 0; position: relative; z-index: 1; }
.board-label { font-size: 14px; opacity: .8; }
.board-num { display: flex; align-items: baseline; gap: 8px; line-height: 1; margin: 4px 0 14px; }
.board-num span { font-size: 60px; font-weight: 700; letter-spacing: -2px; font-variant-numeric: tabular-nums; }
.board-num small { font-size: 18px; font-weight: 500; opacity: .85; }
.board.done .board-num span { color: var(--saffron); }

.basket {
  height: 12px; border-radius: 99px;
  background: rgba(255, 255, 255, .14);
  overflow: hidden; position: relative;
}
.basket::after {
  content: ""; position: absolute; inset: 0;
  background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 2px), var(--board) calc(10% - 2px) 10%);
}
.basket-fill {
  height: 100%; width: 0%;
  background: var(--saffron); border-radius: 99px;
  transition: width .6s cubic-bezier(.2, .8, .2, 1);
  margin-inline-start: 0;
}

.board-stats { margin: 0; display: grid; gap: 10px; position: relative; z-index: 1; text-align: end; flex: none; }
.board-stats div { display: grid; }
.board-stats dt { font-size: 12.5px; opacity: .75; }
.board-stats dd { margin: 0; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.2; }

/* ---------- Mode switch ---------- */
.modebar { margin: 16px 0 6px; }
.segmented {
  position: relative; display: grid; grid-template-columns: 1fr 1fr;
  background: var(--surface-2); border-radius: 14px; padding: 4px; height: 48px;
}
.segmented button {
  position: relative; z-index: 1;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font-weight: 600; font-size: 15px; color: var(--muted);
  border-radius: 10px; transition: color .2s;
}
.segmented button svg { width: 19px; height: 19px; }
.segmented button[aria-selected="true"] { color: var(--ink); }
.seg-thumb {
  position: absolute; top: 4px; bottom: 4px; inset-inline-start: 4px;
  width: calc(50% - 4px);
  background: var(--surface); border-radius: 10px; box-shadow: var(--shadow-1);
  transition: transform .28s cubic-bezier(.3, .8, .3, 1), background .2s;
}
.segmented.shop .seg-thumb { transform: translateX(-100%); background: var(--green); }
.segmented.shop button[data-mode="shop"] { color: var(--green-ink); }

/* ---------- Category chips ---------- */
.chips {
  display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
  margin: 10px -14px 4px; padding: 4px 14px 6px;
  scroll-snap-type: x proximity;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; scroll-snap-align: start;
  display: inline-flex; align-items: center; gap: 6px;
  height: 38px; padding: 0 14px; border-radius: 99px;
  background: var(--surface); border: 1.5px solid var(--line);
  font-size: 14px; font-weight: 500; white-space: nowrap;
}
.chip b { font-weight: 600; font-size: 12.5px; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip[aria-pressed="true"] b { color: inherit; opacity: .7; }

/* ---------- List ---------- */
.list { margin-top: 6px; }
.group { margin-top: 18px; }
.group-title {
  display: flex; align-items: center; gap: 8px;
  font-size: 15px; font-weight: 600; margin: 0 4px 8px;
}
.g-ico {
  width: 30px; height: 30px; border-radius: 10px;
  display: grid; place-items: center; font-size: 16px;
  background: color-mix(in srgb, var(--c) 16%, var(--surface));
}
.g-count { color: var(--muted); font-weight: 500; font-size: 13px; }

.items { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.item {
  display: flex; align-items: stretch;
  background: var(--surface); border-radius: var(--r-md);
  box-shadow: var(--shadow-1);
  border-inline-start: 4px solid color-mix(in srgb, var(--c, var(--green)) 70%, transparent);
  transition: opacity .25s, transform .25s;
}
.item.enter { animation: enter .35s cubic-bezier(.2, .8, .2, 1); }
@keyframes enter { from { opacity: 0; transform: translateY(-6px) scale(.98); } }

.check {
  flex: none; width: 60px; display: grid; place-items: center;
}
.check-box {
  width: 30px; height: 30px; border-radius: 50%;
  border: 2.2px solid color-mix(in srgb, var(--ink) 28%, transparent);
  display: grid; place-items: center;
  transition: background .2s, border-color .2s, transform .2s;
}
.check-box svg { width: 18px; height: 18px; stroke-width: 3; color: var(--green-ink); opacity: 0; transform: scale(.4); transition: opacity .2s, transform .25s cubic-bezier(.3, 1.6, .5, 1); }
.item.is-bought .check-box,
.item.pop .check-box { background: var(--green); border-color: var(--green); }
.item.is-bought .check-box svg,
.item.pop .check-box svg { opacity: 1; transform: none; }
.item.pop .check-box { transform: scale(1.12); }
.item.unpop .check-box { background: transparent; border-color: color-mix(in srgb, var(--ink) 28%, transparent); }
.item.unpop .check-box svg { opacity: 0; }
.item.pop { opacity: .55; }

.item-body {
  flex: 1; min-width: 0; text-align: start;
  padding: 13px 4px 12px 14px;
  display: grid; gap: 3px;
}
.item-top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.item-name { font-size: 17px; font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
.qty {
  font-size: 13px; font-weight: 600; color: var(--green);
  background: var(--green-soft); padding: 1px 9px; border-radius: 99px;
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.item-note { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.item-meta { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.item-meta time { opacity: .85; }
.item-meta .sep { width: 3px; height: 3px; border-radius: 50%; background: currentColor; opacity: .5; }
.avatar {
  width: 20px; height: 20px; border-radius: 50%;
  display: inline-grid; place-items: center;
  font-size: 11px; font-weight: 700; color: #fff; background: var(--green);
}
.avatar.m1 { background: #C9852A; }
.avatar.lg { width: 44px; height: 44px; font-size: 19px; }

.item.is-bought { box-shadow: none; background: transparent; border-inline-start-color: transparent; }
.item.is-bought .item-name { text-decoration: line-through; text-decoration-thickness: 1.5px; color: var(--muted); }
.item.is-bought .qty { background: var(--surface-2); color: var(--muted); }

/* ---------- Bought section ---------- */
.bought { margin-top: 28px; padding-top: 14px; border-top: 1.5px dashed var(--line); }
.bought-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.bought-toggle { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; height: 40px; padding-inline-end: 4px; }
.bought-toggle b { font-weight: 600; font-size: 13px; color: var(--muted); background: var(--surface-2); border-radius: 99px; padding: 1px 9px; }
.bought-toggle .chev { width: 18px; height: 18px; color: var(--muted); transition: transform .25s; }
.bought.collapsed .chev { transform: rotate(90deg); }
.bought.collapsed #boughtList { display: none; }
.bought-actions { display: flex; gap: 6px; }
.chip-btn {
  display: inline-flex; align-items: center; gap: 5px;
  height: 36px; padding: 0 12px; border-radius: 99px;
  font-size: 13.5px; font-weight: 500;
  background: var(--surface-2);
}
.chip-btn svg { width: 17px; height: 17px; }
.chip-btn.danger { color: var(--danger); }

/* ---------- Empty states ---------- */
.empty { text-align: center; padding: 44px 24px 24px; }
.empty-ico { font-size: 46px; line-height: 1; }
.empty h3 { font-size: 19px; font-weight: 600; margin-top: 14px; }
.empty p { color: var(--muted); margin-top: 6px; font-size: 15px; }
.empty .btn { margin-top: 18px; }

/* ---------- FAB ---------- */
.fab {
  position: fixed; z-index: 25;
  inset-inline-start: 50%; transform: translateX(50%);
  bottom: calc(18px + var(--safe-b));
  height: 58px; padding: 0 24px 0 26px; border-radius: 99px;
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--green); color: var(--green-ink);
  font-weight: 600; font-size: 16.5px;
  box-shadow: var(--shadow-2);
  transition: transform .15s ease;
}
.fab svg { width: 24px; height: 24px; stroke-width: 2.4; }
.fab:active { transform: translateX(50%) scale(.96); }

/* ---------- Shopping mode ---------- */
body.shop .item-meta,
body.shop .bought-actions { display: none; }
body.shop .check { width: 72px; }
body.shop .check-box { width: 40px; height: 40px; border-width: 2.6px; }
body.shop .check-box svg { width: 24px; height: 24px; }
body.shop .item-body { padding-block: 18px; }
body.shop .item-name { font-size: 19px; }
body.shop .fab { height: 50px; padding: 0 18px; font-size: 15px; opacity: .92; }
body.shop .board { padding-block: 16px 14px; }
body.shop .board-num span { font-size: 48px; }

/* ---------- Sheets ---------- */
.scrim {
  position: fixed; inset: 0; z-index: 40;
  background: var(--scrim);
  opacity: 0; visibility: hidden;
  transition: opacity .25s, visibility .25s;
}
.scrim.show { opacity: 1; visibility: visible; }

.sheet {
  position: fixed; z-index: 50;
  left: 0; right: 0; bottom: var(--kb);
  margin: 0 auto; max-width: 600px;
  max-height: calc(var(--vvh) - var(--safe-t) - 16px);
  display: flex; flex-direction: column;
  background: var(--surface);
  border-radius: var(--r-lg) var(--r-lg) 0 0;
  box-shadow: 0 -10px 40px rgba(0, 0, 0, .18);
  transform: translateY(105%);
  visibility: hidden;
  transition: transform .32s cubic-bezier(.2, .85, .25, 1), visibility 0s linear .32s;
}
.sheet.open { transform: none; visibility: visible; transition: transform .32s cubic-bezier(.2, .85, .25, 1), visibility 0s; }
.sheet.tall { height: calc(var(--vvh) - var(--safe-t) - 40px); }
.sheet-grip { width: 40px; height: 5px; border-radius: 99px; background: var(--line); margin: 10px auto 2px; flex: none; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 6px 16px 4px 10px; flex: none; }
.sheet-head h2 { font-size: 19px; font-weight: 600; }
.sheet-body {
  overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  padding: 8px 16px calc(16px + var(--safe-b));
}

.name-input {
  width: 100%; height: 58px; padding: 0 16px;
  font-size: 20px; font-weight: 600;
  border: 1.5px solid var(--line); border-radius: var(--r-md);
  background: var(--bg); outline: none;
}
.name-input:focus { border-color: var(--green); background: var(--surface); }
.name-input.shake { animation: shake .35s; border-color: var(--danger); }
@keyframes shake { 25% { transform: translateX(6px); } 50% { transform: translateX(-6px); } 75% { transform: translateX(3px); } }

.sug-row {
  display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
  margin: 10px -16px 0; padding: 2px 16px;
  min-height: 2px;
}
.sug-row::-webkit-scrollbar { display: none; }
.sug-row:empty { margin-top: 0; }
.sug {
  flex: none; height: 36px; padding: 0 12px; border-radius: 99px;
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 14px; background: var(--surface-2); white-space: nowrap;
}
.sug:active { background: var(--green-soft); }

.qty-row { display: flex; align-items: center; gap: 10px; margin-top: 16px; }
.stepper {
  flex: none; display: flex; align-items: center;
  height: 48px; border-radius: 14px; background: var(--bg); border: 1.5px solid var(--line);
}
.stepper button { width: 44px; height: 100%; display: grid; place-items: center; color: var(--green); }
.stepper button svg { width: 20px; height: 20px; stroke-width: 2.4; }
.stepper input {
  width: 46px; height: 100%; border: 0; background: none; text-align: center;
  font-size: 18px; font-weight: 600; outline: none; font-variant-numeric: tabular-nums;
}
.unit-row { flex: 1; min-width: 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
.unit-row::-webkit-scrollbar { display: none; }
.unit {
  flex: none; height: 40px; padding: 0 13px; border-radius: 12px;
  font-size: 14px; border: 1.5px solid var(--line); background: var(--surface);
}
.unit[aria-checked="true"] { background: var(--green-soft); border-color: var(--green); color: var(--green); font-weight: 600; }

.mini-label { font-size: 13.5px; color: var(--muted); margin: 18px 2px 8px; font-weight: 500; }
.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; }
.cat {
  display: grid; justify-items: center; gap: 4px;
  padding: 9px 3px 8px; border-radius: 14px;
  border: 1.5px solid var(--line); background: var(--surface);
  font-size: 12px; font-weight: 500; line-height: 1.3; text-align: center;
}
.cat span { font-size: 22px; line-height: 1; }
.cat[aria-checked="true"] {
  border-color: var(--c); color: var(--ink);
  background: color-mix(in srgb, var(--c) 14%, var(--surface));
  font-weight: 600;
}

#fNote {
  width: 100%; margin-top: 16px; padding: 12px 14px; resize: none;
  border: 1.5px solid var(--line); border-radius: var(--r-md);
  background: var(--bg); font-size: 16px; outline: none; line-height: 1.5;
}
#fNote:focus { border-color: var(--green); background: var(--surface); }

.sheet-actions { display: flex; gap: 10px; margin-top: 18px; }
.sheet-actions .btn { flex: 1; white-space: nowrap; padding: 0 14px; }
.sheet-actions .btn-primary { flex: 1.5; }

/* ---------- مستودع الأغراض ---------- */
#itemSheet.catalog-mode { height: calc(var(--vvh) - var(--safe-t) - 28px); }
#itemSheet.catalog-mode #itemForm { display: none; }
#itemSheet:not(.catalog-mode) #catalogPane,
#itemSheet:not(.catalog-mode) #pickBar { display: none; }
.add-mode { padding: 4px 16px 6px; flex: none; }
.add-mode .segmented { height: 44px; }
.segmented.alt .seg-thumb { transform: translateX(-100%); }
#addSeg button[aria-selected="true"] { color: var(--ink); }

.catalog-pane { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.catalog-top { flex: none; padding: 6px 16px 0; }
.catalog-top .search-in { height: 46px; background: var(--bg); }
.cat-tabs {
  display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
  margin: 10px -16px 0; padding: 2px 16px 10px;
}
.cat-tabs::-webkit-scrollbar { display: none; }
.cat-tab {
  flex: none; height: 36px; padding: 0 13px; border-radius: 99px;
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 13.5px; font-weight: 500; white-space: nowrap;
  background: var(--bg); border: 1.5px solid var(--line);
}
.cat-tab[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.cat-tab b { font-size: 11.5px; background: var(--green); color: var(--green-ink); border-radius: 99px; padding: 0 6px; }

.catalog {
  flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); grid-auto-rows: auto; align-content: start;
  gap: 8px; padding: 4px 16px 20px;
}
.cat-head { grid-column: 1 / -1; font-size: 13px; font-weight: 600; color: var(--muted); margin: 10px 2px 0; }
.cat-head:first-child { margin-top: 0; }
.tile {
  position: relative; display: grid; justify-items: center; align-content: start; gap: 3px;
  min-height: 94px; height: auto; padding: 12px 4px 10px; border-radius: 16px; overflow: visible;
  background: var(--bg); border: 1.5px solid transparent;
  text-align: center; cursor: pointer; user-select: none; -webkit-user-select: none;
  transition: transform .12s ease, background .15s, border-color .15s;
}
.tile:active { transform: scale(.95); }
.t-emo { font-size: 28px; line-height: 1.15; }
.t-name { font-size: 13px; font-weight: 500; line-height: 1.3; overflow-wrap: anywhere; }
.t-tag { font-size: 11px; color: var(--muted); }
.tile.in { opacity: .5; }
.tile.in .t-tag { color: var(--green); font-weight: 600; }
.tile.mine::after {
  content: ""; position: absolute; top: 8px; inset-inline-end: 8px;
  width: 6px; height: 6px; border-radius: 50%; background: var(--saffron);
}
.tile.sel { background: var(--green-soft); border-color: var(--green); padding-top: 10px; padding-bottom: 8px; }
.tile.sel .t-emo { font-size: 23px; }
.t-check {
  position: absolute; top: 6px; inset-inline-start: 6px;
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--green); color: var(--green-ink);
  display: grid; place-items: center;
}
.t-check svg { width: 13px; height: 13px; stroke-width: 3.2; }
.t-step { display: flex; align-items: center; gap: 2px; margin-top: 3px; }
.t-step button {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--surface); color: var(--green);
  display: grid; place-items: center; font-size: 17px; font-weight: 700; line-height: 1;
  box-shadow: var(--shadow-1);
}
.t-step b { font-size: 12px; font-weight: 600; min-width: 36px; font-variant-numeric: tabular-nums; }
.tile.new { border: 1.5px dashed color-mix(in srgb, var(--green) 55%, transparent); background: transparent; }
.tile.new .t-name { color: var(--green); font-weight: 600; }
.cat-empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 30px 10px; font-size: 14.5px; }

.pick-bar {
  flex: none; display: flex; gap: 10px;
  padding: 10px 16px calc(10px + var(--safe-b));
  border-top: 1px solid var(--line); background: var(--surface);
  animation: enter .25s ease;
}
.pick-bar .btn { height: 50px; }
.pick-bar .btn-soft { flex: 1; }
.pick-bar .btn-primary { flex: 2; }

.i-emo { margin-inline-end: 2px; }

/* Menu */
.menu-user { display: flex; align-items: center; gap: 12px; padding: 8px 4px 16px; border-bottom: 1px solid var(--line); }
.menu-user b { display: block; font-size: 17px; font-weight: 600; }
.menu-user small { color: var(--muted); font-size: 13px; direction: ltr; unicode-bidi: plaintext; }
.menu-members { display: flex; gap: 6px; margin-inline-start: auto; }
.menu-list { display: grid; padding-top: 8px; }
.menu-item {
  display: flex; align-items: center; gap: 14px;
  height: 54px; padding: 0 6px; border-radius: 12px;
  font-size: 16px; text-align: start;
}
.menu-item:active { background: var(--surface-2); }
.menu-item svg { color: var(--muted); }
.menu-item.danger, .menu-item.danger svg { color: var(--danger); }

/* Archive */
.arch-day { font-size: 13.5px; color: var(--muted); font-weight: 600; margin: 16px 2px 8px; }
.arch-day:first-child { margin-top: 4px; }
.arch-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: 14px; background: var(--bg); margin-bottom: 6px;
}
.arch-item .grow { flex: 1; min-width: 0; }
.arch-item b { font-weight: 600; }
.arch-item small { display: block; color: var(--muted); font-size: 12.5px; }
.arch-item .chip-btn { background: var(--surface); flex: none; }

/* Confirm */
.cf-title { font-size: 19px; font-weight: 600; margin-top: 6px; }
.cf-text { color: var(--muted); margin-top: 6px; }

/* ---------- Toasts ---------- */
.toasts {
  position: fixed; z-index: 80;
  top: calc(10px + var(--safe-t)); left: 0; right: 0;
  display: grid; justify-items: center; gap: 8px;
  pointer-events: none; padding: 0 14px;
}
.toast {
  pointer-events: auto;
  display: flex; align-items: center; gap: 12px;
  min-height: 46px; max-width: 520px;
  padding: 8px 8px 8px 16px; padding-inline-start: 16px;
  border-radius: 14px;
  background: var(--ink); color: var(--bg);
  box-shadow: 0 10px 30px rgba(0, 0, 0, .2);
  font-size: 14.5px;
  animation: toastIn .3s cubic-bezier(.2, .9, .3, 1.2);
}
.toast.out { animation: toastOut .22s ease forwards; }
.toast button {
  font-weight: 600; color: var(--saffron);
  height: 34px; padding: 0 10px; border-radius: 10px;
}
@keyframes toastIn { from { opacity: 0; transform: translateY(-14px) scale(.96); } }
@keyframes toastOut { to { opacity: 0; transform: translateY(-10px); } }

@media (min-width: 640px) {
  .wrap { padding-top: 12px; }
  .board-num span { font-size: 68px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

const norm = (s) => String(s || '').trim().toLowerCase()

const toLatinDigits = (s) => String(s).replace(/[٠-٩]/g, (d) => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, (d) => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٫,]/g, '.');

const emojiFor = (name) => CATALOG_BY_KEY.get(norm(name))?.emoji || '';
function guessByKeywords(name) {
  const tk = tokens(name);
  const joined = ' ' + tk.join(' ') + ' ';
  let best = null, score = 0;
  for (const [cat, list] of KW) {
    for (const kw of list) {
      let hit = false;
      if (kw.includes(' ')) hit = joined.includes(' ' + kw + ' ');
      else hit = tk.some((t) => t === kw || (kw.length >= 3 && t.startsWith(kw) && t.length - kw.length <= 2));
      if (hit && kw.length > score) { best = cat; score = kw.length; }
    }
  }
  return best;
}
function guessCat(name) {
  const k = norm(name);
  if (!k) return null;
  const s = S.sugs.find((x) => norm(x.name) === k);
  if (s?.category && CAT[s.category]) return s.category;
  const c = CATALOG_BY_KEY.get(k);
  if (c) return c.cat;
  return guessByKeywords(name);
}

function ago(t) {
  if (!t) return '';
  const s = (t - Date.now()) / 1000, a = Math.abs(s);
  if (a < 50) return 'الآن';
  if (a < 3600) return rtf.format(Math.round(s / 60), 'minute');
  if (a < 86400) return rtf.format(Math.round(s / 3600), 'hour');
  if (a < 7 * 86400) return rtf.format(Math.round(s / 86400), 'day');
  return new Date(t).toLocaleDateString(LOCALE, { day: 'numeric', month: 'long' });
}

  return (bought ? 'من شراء ' : 'من إضافة ') + (name || email || '—');
}
function qtyText(i) {
  const q = Number(i.qty) || 1, u = i.unit || 'حبة';
  if (u === 'حبة') return q === 1 ? '' : `× ${fmtNum(q)}`;
  return `${fmtNum(q)} ${u}`;
}
function countWord(n) {
  if (n === 0) return 'أغراض';
  if (n === 1) return 'غرض';
  if (n === 2) return 'غرضين';
  if (n >= 3 && n <= 10) return 'أغراض';
  return 'غرض';
}

function applyOp(d, op) {
  d.items = d.items || {}; d.sugs = d.sugs || {};
  switch (op.t) {
    case 'add': case 'set': d.items[op.id] = op.data; break;
    case 'update': if (d.items[op.id]) Object.assign(d.items[op.id], op.patch); break;
    case 'remove': delete d.items[op.id]; break;
    case 'batch': op.ops.forEach((o) => applyOp(d, o)); break;
    case 'sug': {
      const c = d.sugs[op.key] || {};
      d.sugs[op.key] = { name: op.name, category: op.category, unit: op.unit, count: (c.count || 0) + 1, lastUsed: op.at };
      break;
    }
  }
}

function pruneDoc(d) {
  // نحتفظ بآخر 300 غرض مؤرشف فقط حتى يبقى الملف خفيفاً
  const arch = Object.entries(d.items).filter(([, v]) => v.archived).sort((a, b) => (b[1].archivedAt || 0) - (a[1].archivedAt || 0));
  arch.slice(300).forEach(([id]) => delete d.items[id]);
  const sugs = Object.entries(d.sugs).sort((a, b) => (b[1].lastUsed || 0) - (a[1].lastUsed || 0));
  sugs.slice(400).forEach(([k]) => delete d.sugs[k]);
}

// ---------- GitHub: ترميز وطلبات ----------
const b64e = (str) => {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(bin);
};
const b64d = (b) => new TextDecoder().decode(Uint8Array.from(atob(String(b).replace(/\s/g, '')), (c) => c.charCodeAt(0)));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const ghHeaders = (token, extra = {}) => ({
  Authorization: 'Bearer ' + token,
  Accept: 'application/vnd.github+json',
  'X-GitHub-Api-Version': '2022-11-28',
  ...extra,
});

async function checkToken(token) {
  const res = await fetch(`${GH_API}/repos/${GITHUB_OWNER}/${DATA_REPO}`, { headers: ghHeaders(token), cache: 'no-store' });
  if (res.status === 401) return { ok: false, msg: 'المفتاح غير صحيح أو منتهي. انسخه من GitHub مرة ثانية.' };
  if (res.status === 404 || res.status === 403) return { ok: false, msg: `المفتاح ما له صلاحية على المستودع ${DATA_REPO}. تأكد إنك اخترته في Repository access.` };
  if (!res.ok) return { ok: false, msg: 'تعذّر الاتصال بـ GitHub. تحقق من الإنترنت.' };
  const j = await res.json();
  if (j.permissions && !j.permissions.push) return { ok: false, msg: 'المفتاح للقراءة فقط. اجعل صلاحية Contents على Read and write.' };
  return { ok: true, isPrivate: !!j.private };
}

function createGitHubStore(token) {
  const fileUrl = `${GH_API}/repos/${GITHUB_OWNER}/${DATA_REPO}/contents/${DATA_FILE}`;
  const CACHE = 'mq.gh.cache', QUEUE = 'mq.gh.queue';
  const cached = ls.get(CACHE, null);
  const hadCache = !!cached;
  let base = cached || { doc: emptyDoc(), sha: null };
  let queue = ls.get(QUEUE, []);
  let etag = null, known = false;
  let online = true, authFail = false, flushing = false, again = false, lastSig = '', timer = null;
  const itemL = new Set(), sugL = new Set();
  let firstLoad = null;

  const view = () => { const d = clone(base.doc); queue.forEach((op) => applyOp(d, op)); return d; };
  const emit = (force = false) => {
    const d = view();
    const sig = JSON.stringify(d) + queue.length + online;
    if (!force && sig === lastSig) return;
    lastSig = sig;
    const items = Object.entries(d.items || {}).filter(([, v]) => !v.archived).map(([id, v]) => ({ id, ...v }));
    const sugs = Object.entries(d.sugs || {}).map(([id, v]) => ({ id, ...v }));
    const meta = { pending: queue.length > 0, offline: !online };
    itemL.forEach((f) => f(clone(items), meta));
    sugL.forEach((f) => f(sugs));
  };

  async function getRemote() {
    const res = await fetch(fileUrl, {
      headers: ghHeaders(token, etag && known ? { 'If-None-Match': etag } : {}),
      cache: 'no-store',
    });
    if (res.status === 304) return;
    if (res.status === 401) { authFail = true; throw new Error('auth'); }
    if (res.status === 404) { base = { doc: emptyDoc(), sha: null }; known = true; etag = null; return; }
    if (!res.ok) throw new Error('get ' + res.status);
    const j = await res.json();
    let d = null;
    try { d = JSON.parse(b64d(j.content)); } catch { d = null; }
    base = { doc: d && typeof d === 'object' ? { ...emptyDoc(), ...d } : emptyDoc(), sha: j.sha };
    etag = res.headers.get('ETag');
    known = true;
  }

  async function putRemote(d) {
    const body = { message: 'تحديث المقاضي', content: b64e(JSON.stringify(d)) };
    if (base.sha) body.sha = base.sha;
    const res = await fetch(fileUrl, {
      method: 'PUT',
      headers: ghHeaders(token, { 'Content-Type': 'application/json' }),
      body: JSON.stringify(body),
    });
    if (res.status === 409 || res.status === 422) return false; // تعارض: أحد عدّل قبلنا
    if (res.status === 401) { authFail = true; throw new Error('auth'); }
    if (!res.ok) throw new Error('put ' + res.status);
    const j = await res.json();
    base = { doc: d, sha: j.content && j.content.sha };
    etag = null;
    return true;
  }

  async function flush() {
    if (flushing) { again = true; return; }
    flushing = true;
    try {
      for (let attempt = 0; attempt < 6; attempt++) {
        again = false;
        await getRemote();
        const ops = queue.slice();
        if (!ops.length) break;
        const next = clone(base.doc);
        ops.forEach((op) => applyOp(next, op));
        pruneDoc(next);
        next.v = (next.v || 0) + 1;
        const ok = await putRemote(next);
        if (!ok) { known = false; etag = null; await sleep(500 * (attempt + 1)); continue; }
        queue = queue.slice(ops.length);
        ls.set(QUEUE, queue);
        if (!queue.length && !again) break;
      }
      ls.set(CACHE, base);
      online = true;
    } catch (e) {
      console.warn(e);
      online = false;
    } finally {
      flushing = false;
      emit();
    }
  }

  const schedule = (ms = 500) => { clearTimeout(timer); timer = setTimeout(flush, ms); };
  const push = (op) => {
    queue.push(op);
    ls.set(QUEUE, queue);
    emit();
    schedule();
    return Promise.resolve();
  };
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  setInterval(() => { if (document.visibilityState === 'visible') flush(); }, POLL_MS);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') flush(); });
  window.addEventListener('online', () => flush());
  window.addEventListener('focus', () => flush());

  return {
    get authFail() { return authFail; },
    watchItems(cb) {
      itemL.add(cb);
      if (hadCache) queueMicrotask(() => emit(true));
      firstLoad = firstLoad || flush();
      firstLoad.then(() => emit(true));
      return () => itemL.delete(cb);
    },
    watchSuggestions(cb) { sugL.add(cb); queueMicrotask(() => emit(true)); return () => sugL.delete(cb); },
    add: (data) => push({ t: 'add', id: uid(), data }),
    set: (id, data) => push({ t: 'set', id, data }),
    update: (id, patch) => push({ t: 'update', id, patch }),
    remove: (id) => push({ t: 'remove', id }),
    batch: (ops) => push({
      t: 'batch',
      ops: ops.map((o) => (o.type === 'delete' ? { t: 'remove', id: o.id } : o.type === 'set' ? { t: 'set', id: o.id, data: o.data } : { t: 'update', id: o.id, patch: o.patch })),
    }),
    touchSuggestion: (s) => push({ t: 'sug', key: s.key, name: s.name, category: s.category, unit: s.unit, at: Date.now() }),
    async loadArchive() {
      await flush();
      const d = view();
      return Object.entries(d.items || {}).filter(([, v]) => v.archived).map(([id, v]) => ({ id, ...v }));
    },
  };
}

// ---------- مفتاح GitHub (يُحفظ في الرابط بعد # ولا يُرفع لأي مكان) ----------
const KEY_RE = /^(github_pat_|ghp_)[A-Za-z0-9_]{20,255}$/;
function readKey() {
  const fromHash = new URLSearchParams(location.hash.slice(1)).get('t');
  if (fromHash && KEY_RE.test(fromHash)) { ls.set('mq.token', fromHash); return fromHash; }
  const saved = ls.get('mq.token', null);
  if (saved && KEY_RE.test(saved)) {
    history.replaceState(null, '', location.pathname + location.search + '#t=' + saved);
    return saved;
  }
  return null;
}
const listLink = () => location.origin + location.pathname + '#t=' + S.key;

function greeting() {
  const h = new Date().getHours();
  if (h < 5) return 'مساء الخير';
  if (h < 12) return 'صباح الخير';
  return 'مساء الخير';
}

function onWatchError(err) {
  console.error(err);
  hideSplash();
  if (err?.code === 'permission-denied') {
    toast('قاعدة البيانات رفضت الوصول. تأكد أنك لصقت قواعد Firestore ونشرتها.');
  } else {
    toast('انقطع الاتصال بالقائمة. حدّث الصفحة للمحاولة من جديد.');
  }
}

function run(p) {
  Promise.resolve(p).catch((e) => {
    console.error(e);
    toast(e?.code === 'permission-denied' ? 'لم يُحفظ التغيير: تحقق من قواعد Firestore.' : 'لم يُحفظ التغيير. تحقق من الاتصال.');
  });
}

function addItem(d) {
  const now = Date.now();
  const item = {
    name: d.name, qty: d.qty, unit: d.unit, note: d.note, category: d.category,
    bought: false, archived: false,
    addedBy: S.user.email, addedByName: S.user.name, createdAt: now, updatedAt: now,
    boughtBy: null, boughtByName: null, boughtAt: null, archivedAt: null,
  };
  run(S.store.add(item));
  run(S.store.touchSuggestion({ key: sugKey(d.name), name: d.name, category: d.category, unit: d.unit }));
}

function updateItem(id, patch, { optimistic = true } = {}) {
  const it = byId(id);
  if (optimistic && it) { Object.assign(it, patch); render(); }
  run(S.store.update(id, { ...patch, updatedAt: Date.now() }));
}

function toggleBought(id) {
  const it = byId(id);
  if (!it) return;
  const now = Date.now();
  const patch = it.bought
    ? { bought: false, boughtBy: null, boughtByName: null, boughtAt: null }
    : { bought: true, boughtBy: S.user.email, boughtByName: S.user.name, boughtAt: now };
  updateItem(id, patch);
}

function deleteItem(id) {
  const it = byId(id);
  if (!it) return;
  const { id: _omit, ...data } = it;
  S.items = S.items.filter((x) => x.id !== id);
  render();
  run(S.store.remove(id));
  toast(`حُذف «${it.name}»`, { action: 'تراجع', onAction: () => run(S.store.set(id, data)) });
}

function boughtItems() { return S.items.filter((i) => i.bought); }

function archiveBought() {
  const list = boughtItems();
  if (!list.length) return;
  const now = Date.now(), ids = list.map((i) => i.id);
  S.items = S.items.filter((i) => !i.bought);
  render();
  run(S.store.batch(ids.map((id) => ({ id, type: 'update', patch: { archived: true, archivedAt: now, updatedAt: now } }))));
  toast(`نُقل ${ids.length} ${countWord(ids.length)} إلى الأرشيف`, {
    action: 'تراجع',
    onAction: () => run(S.store.batch(ids.map((id) => ({ id, type: 'update', patch: { archived: false, archivedAt: null } })))),
  });
}

async function clearBought() {
  const list = boughtItems();
  if (!list.length) return;
  const ok = await confirmDialog({
    title: 'مسح المشتريات؟',
    text: `سيُحذف ${list.length} ${countWord(list.length)} نهائياً. إن أردت الاحتفاظ بها اختر «أرشفة».`,
    okText: 'مسح',
  });
  if (!ok) return;
  const backup = list.map(({ id, ...data }) => ({ id, data }));
  S.items = S.items.filter((i) => !i.bought);
  render();
  run(S.store.batch(backup.map((b) => ({ id: b.id, type: 'delete' }))));
  toast('مُسحت المشتريات', { action: 'تراجع', onAction: () => run(S.store.batch(backup.map((b) => ({ id: b.id, type: 'set', data: b.data })))) });
}

const ICON_CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12.5 10 17.5 19 7"/></svg>';

function render() {
  if (!S.ready) return;
  const all = S.items;
  const active = all.filter((i) => !i.bought);
  const bought = all.filter((i) => i.bought).sort((a, b) => (b.boughtAt || 0) - (a.boughtAt || 0));

  // اللوحة
  $('#stLeft').textContent = active.length;
  $('#stLeftWord').textContent = countWord(active.length);
  $('#stTotal').textContent = all.length;
  $('#stDone').textContent = bought.length;
  const pct = all.length ? Math.round((bought.length / all.length) * 100) : 0;
  $('#basketFill').style.width = pct + '%';
  const done = all.length > 0 && active.length === 0;
  $('.board').classList.toggle('done', done);
  $('#boardLabel').textContent = done ? 'خلصت المقاضي' : all.length ? 'باقي' : 'القائمة';

  renderChips(active);

  // الفلترة والبحث
  const q = norm(S.query);
  const match = (i) => (S.filter === 'all' || i.category === S.filter)
    && (!q || norm(i.name + ' ' + (i.note || '')).includes(q));
  const activeF = active.filter(match).sort((a, b) =>
    ((CAT[a.category] || CAT.other).order - (CAT[b.category] || CAT.other).order) || ((a.createdAt || 0) - (b.createdAt || 0)));
  const boughtF = bought.filter(match);

  // القائمة
  const listEl = $('#list');
  if (!activeF.length) {
    listEl.innerHTML = emptyState(all.length, active.length, bought.length, !!(q || S.filter !== 'all'));
  } else {
    const groups = [];
    for (const it of activeF) {
      const cid = CAT[it.category] ? it.category : 'other';
      const last = groups[groups.length - 1];
      if (last && last.cid === cid) last.items.push(it); else groups.push({ cid, items: [it] });
    }
    listEl.innerHTML = groups.map(({ cid, items }) => {
      const c = CAT[cid];
      return `<section class="group" style="--c:${c.hue}">
        <h3 class="group-title"><span class="g-ico">${c.icon}</span>${esc(c.name)}<span class="g-count">${items.length}</span></h3>
        <ul class="items">${items.map(itemHTML).join('')}</ul>
      </section>`;
    }).join('');
  }

  // المشتريات
  const sec = $('#boughtSec');
  sec.hidden = boughtF.length === 0;
  sec.classList.toggle('collapsed', !S.boughtOpen);
  $('.bought-toggle').setAttribute('aria-expanded', String(S.boughtOpen));
  $('#boughtCount').textContent = boughtF.length;
  $('#boughtList').innerHTML = boughtF.map(itemHTML).join('');

  // تتبع العناصر الجديدة للحركة
  S.seen = new Set(all.map((i) => i.id));
  S.firstPaint = false;

  // احتفال عند انتهاء القائمة
  if (S.lastActive > 0 && active.length === 0 && bought.length > 0) celebrate();
  S.lastActive = active.length;

  renderSync();
}

function itemHTML(i) {
  const c = CAT[i.category] || CAT.other;
  const qty = qtyText(i);
  const isNew = !S.firstPaint && !S.seen.has(i.id);
  const metaEmail = i.bought ? i.boughtBy : i.addedBy;
  const metaName = i.bought ? i.boughtByName : i.addedByName;
  const when = i.bought ? i.boughtAt : i.createdAt;
  return `<li class="item${i.bought ? ' is-bought' : ''}${isNew ? ' enter' : ''}" data-id="${esc(i.id)}" style="--c:${c.hue}">
    <button class="check" data-action="toggle" aria-label="${i.bought ? 'إلغاء تحديد' : 'تم شراء'} ${esc(i.name)}" aria-pressed="${i.bought}">
      <span class="check-box">${ICON_CHECK}</span>
    </button>
    <button class="item-body" data-action="edit">
      <span class="item-top"><span class="item-name">${emojiFor(i.name) ? `<span class="i-emo">${emojiFor(i.name)}</span>` : ''}${esc(i.name)}</span>${qty ? `<span class="qty">${esc(qty)}</span>` : ''}</span>
      ${i.note ? `<span class="item-note">${esc(i.note)}</span>` : ''}
      <span class="item-meta">${avatar(metaEmail, metaName)}<span>${esc(byLine(i.bought, metaEmail, metaName))}</span><span class="sep"></span><time>${esc(ago(when))}</time></span>
    </button>
  </li>`;
}

function emptyState(total, active, bought, filtered) {
  if (filtered) {
    return `<div class="empty"><div class="empty-ico">🔎</div><h3>ما فيه نتائج</h3>
      <p>جرّب كلمة ثانية أو اختر «الكل».</p></div>`;
  }
  if (total > 0 && active === 0 && bought > 0) {
    return `<div class="empty"><div class="empty-ico">🎉</div><h3>اشتريت كل المطلوب</h3>
      <p>أرشف المشتريات تحت لتبدأ القائمة الجاية من جديد.</p></div>`;
  }
  return `<div class="empty"><div class="empty-ico">🧺</div><h3>القائمة فاضية</h3>
    <p>أضف أول غرض ناقص، ويظهر للطرف الثاني مباشرة.</p>
    <button class="btn btn-primary" data-action="open-add">أضف غرض</button></div>`;
}

function renderChips(active) {
  const counts = {};
  active.forEach((i) => { const k = CAT[i.category] ? i.category : 'other'; counts[k] = (counts[k] || 0) + 1; });
  const cats = CATS.filter((c) => counts[c.id] || S.filter === c.id);
  if (S.filter !== 'all' && !cats.length) S.filter = 'all';
  const chip = (id, label, n) =>
    `<button class="chip" data-action="filter" data-cat="${id}" aria-pressed="${S.filter === id}">${label}${n ? ` <b>${n}</b>` : ''}</button>`;
  $('#chips').innerHTML = cats.length < 2 && S.filter === 'all'
    ? ''
    : chip('all', 'الكل', active.length) + cats.map((c) => chip(c.id, `${c.icon} ${esc(c.name)}`, counts[c.id] || 0)).join('');
}

function renderSync() {
  const el = $('#sync');
  let st = 'ok', label = 'متزامن';
  if (!navigator.onLine || S.offline) { st = 'off'; label = S.pending ? 'محفوظ بالجهاز' : 'بدون اتصال'; }
  else if (S.pending) { st = 'busy'; label = 'يحفظ'; }
  el.dataset.state = st;
  el.querySelector('span').textContent = label;
}

let lastCelebrate = 0;
function celebrate() {
  if (Date.now() - lastCelebrate < 4000) return;
  lastCelebrate = Date.now();
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  if (typeof window.confetti === 'function') {
    window.confetti({ particleCount: 110, spread: 75, origin: { y: 0.25 }, colors: ['#0F6E54', '#F3B33D', '#35B48A', '#ffffff'], disableForReducedMotion: true });
  }
}

let wakeLock = null;
async function setWake(on) {
  try {
    if (on && 'wakeLock' in navigator && document.visibilityState === 'visible') {
      wakeLock = await navigator.wakeLock.request('screen');
    } else if (!on && wakeLock) {
      await wakeLock.release(); wakeLock = null;
    }
  } catch { /* غير مدعوم */ }
}

function applyMode(announce) {
  document.body.classList.toggle('shop', S.shop);
  $('#modeSeg').classList.toggle('shop', S.shop);
  document.querySelectorAll('#modeSeg button').forEach((b) =>
    b.setAttribute('aria-selected', String((b.dataset.mode === 'shop') === S.shop)));
  setWake(S.shop);
  if (announce && S.shop) toast('وضع التسوق: اضغط على الغرض لتحديده، والشاشة تبقى مضاءة.');
}

// =========================================================
//  النوافذ (Sheets)
// =========================================================
function openSheet(id) {
  if (S.openSheet && S.openSheet !== id) $('#' + S.openSheet).classList.remove('open');
  S.openSheet = id;
  $('#' + id).classList.add('open');
  $('#scrim').classList.add('show');
  document.body.classList.add('locked');
}
function closeSheet() {
  if (S.openSheet) $('#' + S.openSheet).classList.remove('open');
  if (S.openSheet === 'confirmSheet' && confirmResolve) { confirmResolve(false); confirmResolve = null; }
  S.openSheet = null;
  $('#scrim').classList.remove('show');
  document.body.classList.remove('locked');
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
}

let confirmResolve = null;
function confirmDialog({ title, text, okText }) {
  $('#cfTitle').textContent = title;
  $('#cfText').textContent = text;
  $('#cfOk').textContent = okText;
  openSheet('confirmSheet');
  return new Promise((res) => { confirmResolve = res; });
}

// ---------- نافذة الغرض ----------
function openItemSheet(id = null) {
  const it = id ? byId(id) : null;
  S.editing = it ? it.id : null;
  S.form = {
    cat: it ? (CAT[it.category] ? it.category : 'other') : (S.filter !== 'all' ? S.filter : 'other'),
    catTouched: !!it || S.filter !== 'all',
    unit: it?.unit || 'حبة',
  };
  $('#sheetTitle').textContent = it ? 'تعديل الغرض' : 'إضافة للقائمة';
  $('#addModeWrap').hidden = !!it;
  S.pick = new Map();
  S.catQuery = '';
  $('#catSearch').value = '';
  if (!S.catTab) S.catTab = S.sugs.length ? 'fav' : CATS[0].id;
  if (S.filter !== 'all') S.catTab = S.filter;
  $('#btnSave').textContent = it ? 'حفظ التعديل' : 'إضافة';
  $('#btnMore').hidden = !!it;
  $('#btnDelete').hidden = !it;
  $('#fName').value = it?.name || '';
  $('#fQty').value = fmtNum(it?.qty || 1);
  $('#fNote').value = it?.note || '';
  renderUnits(); renderCats(); renderSuggestions();
  setAddMode(it ? 'manual' : (ls.get('mq.addMode', 'catalog')), { focus: false });
  openSheet('itemSheet');
  if (!it && S.addMode === 'manual') $('#fName').focus({ preventScroll: true });
  $('#itemForm').scrollTop = 0;
  $('#catalogGrid').scrollTop = 0;
}

// ---------- المستودع ----------
const ICON_TICK = '<svg viewBox="0 0 24 24"><path d="M5 12.5 10 17.5 19 7"/></svg>';

function setAddMode(mode, { focus = true } = {}) {
  S.addMode = mode;
  if (!S.editing) ls.set('mq.addMode', mode);
  const sheet = $('#itemSheet');
  sheet.classList.toggle('catalog-mode', mode === 'catalog');
  $('#addSeg').classList.toggle('alt', mode === 'manual');
  document.querySelectorAll('#addSeg button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.mode === mode)));
  if (mode === 'catalog') { renderCatTabs(); renderCatalog(); renderPickBar(); }
  else if (focus) $('#fName').focus({ preventScroll: true });
}

// كل الأغراض: الجاهزة + اللي أضفتوها بأنفسكم (أغراضي)
function allEntries() {
  const list = CATALOG.slice();
  for (const s of S.sugs) {
    const k = norm(s.name);
    if (!k || CATALOG_BY_KEY.has(k)) continue;
    const cat = CAT[s.category] ? s.category : (guessByKeywords(s.name) || 'other');
    list.push({ key: k, name: s.name, cat, unit: UNITS.includes(s.unit) ? s.unit : (DEF_UNIT[cat] || 'حبة'), emoji: CAT[cat].icon, mine: true });
  }
  return list;
}

function renderCatTabs() {
  const count = {};
  S.pick.forEach((p) => { count[p.cat] = (count[p.cat] || 0) + 1; });
  const tab = (id, label, n) =>
    `<button type="button" class="cat-tab" data-action="cat-tab" data-tab="${id}" aria-pressed="${!S.catQuery && S.catTab === id}">${label}${n ? ` <b>${n}</b>` : ''}</button>`;
  $('#catTabs').innerHTML = (S.sugs.length ? tab('fav', '⭐ المتكرر', 0) : '')
    + CATS.map((c) => tab(c.id, `${c.icon} ${esc(c.name)}`, count[c.id] || 0)).join('');
}

function tileHTML(e, inList) {
  const p = S.pick.get(e.key);
  const cls = ['tile', p ? 'sel' : '', inList ? 'in' : '', e.mine ? 'mine' : ''].join(' ');
  let extra = '';
  if (p) {
    extra = `<span class="t-check">${ICON_TICK}</span>
      <span class="t-step">
        <button type="button" data-action="tile-plus" aria-label="زيادة">+</button>
        <b>${esc(qtyText({ qty: p.qty, unit: p.unit }) || '1')}</b>
        <button type="button" data-action="tile-minus" aria-label="إنقاص">−</button>
      </span>`;
  } else if (inList) {
    extra = '<span class="t-tag">✓ بالقائمة</span>';
  }
  return `<div class="${cls}" role="button" tabindex="0" data-action="tile" data-key="${esc(e.key)}">
    <span class="t-emo">${e.emoji}</span><span class="t-name">${esc(e.name)}</span>${extra}</div>`;
}

function renderCatalog() {
  const grid = $('#catalogGrid');
  const entries = allEntries();
  const inList = new Set(S.items.filter((i) => !i.bought).map((i) => norm(i.name)));
  const q = norm(S.catQuery);
  let html = '';
  if (q) {
    const hits = entries.filter((e) => e.key.includes(q) || (e.alias && e.alias.includes(q)))
      .sort((a, b) => (Number(b.key.startsWith(q)) - Number(a.key.startsWith(q))) || (a.name.length - b.name.length));
    html = hits.slice(0, 60).map((e) => tileHTML(e, inList.has(e.key))).join('');
    const exact = hits.some((e) => e.key === q) || S.pick.has(q);
    if (!exact) {
      html += `<div class="tile new" role="button" tabindex="0" data-action="tile-new">
        <span class="t-emo">➕</span><span class="t-name">«${esc(S.catQuery.trim())}»</span><span class="t-tag">أضفه كغرض جديد</span></div>`;
    }
    if (!hits.length) html = `<p class="cat-empty">ما لقيت «${esc(S.catQuery.trim())}» في المستودع، تقدر تضيفه كغرض جديد 👇</p>` + html;
  } else if (S.catTab === 'fav') {
    const byKey = new Map(entries.map((e) => [e.key, e]));
    const fav = S.sugs.slice().sort((a, b) => ((b.count || 0) - (a.count || 0)) || ((b.lastUsed || 0) - (a.lastUsed || 0)))
      .map((s) => byKey.get(norm(s.name))).filter(Boolean).slice(0, 40);
    html = fav.length ? fav.map((e) => tileHTML(e, inList.has(e.key))).join('')
      : '<p class="cat-empty">الأغراض اللي تضيفونها كثير بتطلع هنا.</p>';
  } else {
    const list = entries.filter((e) => e.cat === S.catTab);
    const base = list.filter((e) => !e.mine), mine = list.filter((e) => e.mine);
    html = base.map((e) => tileHTML(e, inList.has(e.key))).join('');
    if (mine.length) html += `<p class="cat-head">أغراضي</p>` + mine.map((e) => tileHTML(e, inList.has(e.key))).join('');
  }
  grid.innerHTML = html;
}

function renderPickBar() {
  const n = S.pick.size;
  $('#pickBar').hidden = n === 0;
  $('#pickAdd').textContent = n === 1 ? 'إضافة غرض واحد' : n === 2 ? 'إضافة غرضين' : `إضافة ${n} ${countWord(n)}`;
}

function refreshCatalog() { renderCatTabs(); renderCatalog(); renderPickBar(); }

function pickTile(key) {
  if (S.pick.has(key)) { S.pick.delete(key); refreshCatalog(); return; }
  const e = allEntries().find((x) => x.key === key);
  if (!e) return;
  const inList = S.items.find((i) => !i.bought && norm(i.name) === key);
  if (inList) {
    toast(`«${inList.name}» موجود بالقائمة`, {
      action: 'زد الكمية',
      onAction: () => updateItem(inList.id, { qty: Math.min(999, (Number(inList.qty) || 1) + 1) }),
    });
    return;
  }
  S.pick.set(key, { name: e.name, cat: e.cat, unit: e.unit, qty: 1 });
  refreshCatalog();
}

function stepTile(key, dir) {
  const p = S.pick.get(key);
  if (!p) return;
  const step = HALF_UNITS.has(p.unit) ? 0.5 : 1;
  const v = Math.round((p.qty + dir * step) / step) * step;
  if (v < step) S.pick.delete(key); else p.qty = Math.min(999, v);
  refreshCatalog();
}

function pickNew() {
  const name = S.catQuery.trim().replace(/\s+/g, ' ').slice(0, 80);
  if (!name) return;
  const cat = guessCat(name) || 'other';
  S.pick.set(norm(name), { name, cat, unit: DEF_UNIT[cat] === 'كيلو' ? 'كيلو' : 'حبة', qty: 1 });
  S.catQuery = ''; $('#catSearch').value = '';
  refreshCatalog();
  toast(`تم تحديد «${name}»، اضغط «إضافة» تحت`);
}

function addPicked() {
  const list = [...S.pick.values()];
  if (!list.length) return;
  for (const p of list) {
    addItem({ name: p.name, qty: p.qty, unit: p.unit, note: '', category: p.cat });
  }
  S.pick.clear();
  closeSheet();
  toast(list.length === 1 ? `أُضيف «${list[0].name}»` : `أُضيف ${list.length} ${countWord(list.length)} للقائمة`);
}

function renderUnits() {
  $('#unitRow').innerHTML = UNITS.map((u) =>
    `<button type="button" class="unit" role="radio" data-action="unit" data-unit="${u}" aria-checked="${S.form.unit === u}">${u}</button>`).join('');
}
function renderCats() {
  $('#catGrid').innerHTML = CATS.map((c) =>
    `<button type="button" class="cat" role="radio" data-action="cat" data-cat="${c.id}" style="--c:${c.hue}" aria-checked="${S.form.cat === c.id}"><span>${c.icon}</span>${esc(c.name)}</button>`).join('');
}
function renderSuggestions() {
  const row = $('#sugRow');
  if (S.editing) { row.innerHTML = ''; return; }
  const q = norm($('#fName').value);
  const activeNames = new Set(S.items.filter((i) => !i.bought).map((i) => norm(i.name)));
  let list = S.sugs.filter((s) => s.name && !activeNames.has(norm(s.name)));
  if (q) {
    list = list.filter((s) => { const n = norm(s.name); return n.includes(q) && n !== q; })
      .sort((a, b) => (Number(norm(b.name).startsWith(q)) - Number(norm(a.name).startsWith(q))) || ((b.count || 0) - (a.count || 0)));
  } else {
    list.sort((a, b) => ((b.count || 0) - (a.count || 0)) || ((b.lastUsed || 0) - (a.lastUsed || 0)));
  }
  row.innerHTML = list.slice(0, 14).map((s) =>
    `<button type="button" class="sug" data-action="sug" data-key="${esc(s.id)}">${(CAT[s.category] || CAT.other).icon} ${esc(s.name)}</button>`).join('');
}

function stepQty(dir) {
  const step = HALF_UNITS.has(S.form.unit) ? 0.5 : 1;
  let v = parseNum($('#fQty').value);
  if (!Number.isFinite(v)) v = 1;
  v = Math.round((v + dir * step) / step) * step;
  v = Math.min(999, Math.max(step, v));
  $('#fQty').value = fmtNum(v);
}

function submitItem({ more = false } = {}) {
  const nameEl = $('#fName');
  const name = nameEl.value.trim().replace(/\s+/g, ' ');
  if (!name) {
    nameEl.classList.remove('shake'); void nameEl.offsetWidth; nameEl.classList.add('shake');
    nameEl.focus();
    return;
  }
  let qty = parseNum($('#fQty').value);
  if (!Number.isFinite(qty) || qty <= 0) qty = 1;
  qty = Math.min(999, Math.round(qty * 100) / 100);
  const data = {
    name: name.slice(0, 80), qty, unit: S.form.unit,
    note: $('#fNote').value.trim().slice(0, 200),
    category: S.form.cat || guessCat(name) || 'other',
  };

  if (S.editing) {
    const old = byId(S.editing);
    updateItem(S.editing, data);
    if (old && norm(old.name) !== norm(name)) {
      run(S.store.touchSuggestion({ key: sugKey(name), name, category: data.category, unit: data.unit }));
    }
    closeSheet();
    toast('حُفظ التعديل');
    return;
  }

  const dup = S.items.find((i) => !i.bought && norm(i.name) === norm(name));
  if (dup) {
    toast(`«${dup.name}» موجود في القائمة`, {
      action: 'زد الكمية',
      onAction: () => updateItem(dup.id, { qty: Math.min(999, (Number(dup.qty) || 1) + qty) }),
    });
    if (!more) closeSheet();
    else resetAddForm();
    return;
  }

  addItem(data);
  if (more) {
    toast(`أُضيف «${name}»`);
    resetAddForm();
  } else {
    closeSheet();
  }
}

function resetAddForm() {
  $('#fName').value = '';
  $('#fQty').value = '1';
  $('#fNote').value = '';
  S.form = { cat: S.filter !== 'all' ? S.filter : 'other', catTouched: S.filter !== 'all', unit: 'حبة' };
  renderUnits(); renderCats(); renderSuggestions();
  $('#fName').focus({ preventScroll: true });
}

// ---------- الأرشيف ----------
async function openArchive() {
  openSheet('archiveSheet');
  const body = $('#archiveBody');
  body.innerHTML = '<div class="empty"><p>جارٍ التحميل…</p></div>';
  let list = [];
  try { list = await S.store.loadArchive(); } catch (e) { console.error(e); body.innerHTML = '<div class="empty"><p>تعذّر تحميل الأرشيف. تحقق من الاتصال.</p></div>'; return; }
  list.sort((a, b) => (b.archivedAt || 0) - (a.archivedAt || 0));
  list = list.slice(0, 200);
  if (!list.length) {
    body.innerHTML = '<div class="empty"><div class="empty-ico">🗂️</div><h3>الأرشيف فاضي</h3><p>بعد التسوق اضغط «أرشفة» في قسم المشتريات لحفظها هنا.</p></div>';
    return;
  }
  let html = '', lastDay = '';
  for (const i of list) {
    const day = new Date(i.archivedAt || i.boughtAt || Date.now()).toLocaleDateString(LOCALE, { weekday: 'long', day: 'numeric', month: 'long' });
    if (day !== lastDay) { html += `<p class="arch-day">${esc(day)}</p>`; lastDay = day; }
    const qty = qtyText(i);
    html += `<div class="arch-item" data-id="${esc(i.id)}">
      <span style="font-size:20px">${(CAT[i.category] || CAT.other).icon}</span>
      <div class="grow"><b>${esc(i.name)}</b>${qty ? ` <span class="qty">${esc(qty)}</span>` : ''}
        <small>${esc(i.boughtBy ? byLine(true, i.boughtBy, i.boughtByName) : byLine(false, i.addedBy, i.addedByName))}</small></div>
      <button class="chip-btn" data-action="restore">
        <svg viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1L3.5 8.5"/><path d="M3.5 3.5v5h5"/></svg>أعده للقائمة</button>
    </div>`;
  }
  body.innerHTML = html;
}

function restoreFromArchive(id, el) {
  const now = Date.now();
  run(S.store.update(id, {
    archived: false, archivedAt: null, bought: false, boughtBy: null, boughtByName: null, boughtAt: null,
    addedBy: S.user.email, addedByName: S.user.name, createdAt: now, updatedAt: now,
  }));
  el?.remove();
  toast('رجع للقائمة');
}

async function shareLink() {

  closeSheet();
  try {
    if (navigator.share) { await navigator.share({ title: 'مقاضي بيتنا', url }); return; }
  } catch (e) { if (e?.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(url); toast('نُسخ رابط القائمة. أرسله لزوجتك فقط.'); }
  catch { prompt('انسخ رابط القائمة:', url); }
}

// ---------- التنبيهات ----------
function toast(msg, { action, onAction, ms = 4200 } = {}) {
  const box = $('#toasts');
  while (box.children.length >= 2) box.firstElementChild.remove();
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span>${esc(msg)}</span>${action ? `<button type="button">${esc(action)}</button>` : ''}`;
  const kill = () => { if (!el.isConnected) return; el.classList.add('out'); setTimeout(() => el.remove(), 220); };
  if (action) el.querySelector('button').addEventListener('click', () => { onAction?.(); kill(); });
  box.appendChild(el);
  setTimeout(kill, action ? ms + 1800 : ms);
}

// =========================================================
//  الأحداث
// =========================================================
function bindEvents() {
  document.addEventListener('click', onClick);

  $('#itemForm').addEventListener('submit', (e) => { e.preventDefault(); submitItem(); });
  $('#fName').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); submitItem({ more: !S.editing }); }
  });
  $('#fName').addEventListener('input', () => {
    $('#fName').classList.remove('shake');
    renderSuggestions();
    if (!S.form.catTouched) {
      const g = guessCat($('#fName').value) || 'other';
      if (g !== S.form.cat) { S.form.cat = g; renderCats(); }
    }
    const s = S.sugs.find((x) => norm(x.name) === norm($('#fName').value));
    if (s?.unit && UNITS.includes(s.unit) && s.unit !== S.form.unit && !S.editing) { S.form.unit = s.unit; renderUnits(); }
  });
  $('#fQty').addEventListener('focus', (e) => e.target.select());

  // إبقاء لوحة المفاتيح مفتوحة عند الضغط على الاقتراحات
  $('#sugRow').addEventListener('pointerdown', (e) => { if (e.target.closest('.sug')) e.preventDefault(); });

  $('#searchInput').addEventListener('input', (e) => { S.query = e.target.value; render(); });
  $('#catSearch').addEventListener('input', (e) => { S.catQuery = e.target.value; renderCatTabs(); renderCatalog(); $('#catalogGrid').scrollTop = 0; });
  $('#catSearch').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || e.isComposing) return;
    e.preventDefault();
    const q = norm(S.catQuery);
    if (!q) return;
    const hit = allEntries().find((x) => x.key === q);
    if (hit) { pickTile(hit.key); S.catQuery = ''; e.target.value = ''; refreshCatalog(); } else pickNew();
  });
  document.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList?.contains('tile')) { e.preventDefault(); e.target.click(); }
  });

  $('#cfOk').addEventListener('click', () => { const r = confirmResolve; confirmResolve = null; closeSheet(); r?.(true); });
  $('#cfCancel').addEventListener('click', () => closeSheet());

  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.openSheet) closeSheet(); });
  window.addEventListener('online', renderSync);
  window.addEventListener('offline', renderSync);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      if (S.shop) setWake(true);
      if (S.user) { $('#greet').textContent = greeting() + '، ' + S.user.name; render(); }
    }
  });
  setInterval(() => { if (S.ready && !S.openSheet) render(); }, 60000);
}

function onClick(e) {
  const a = e.target.closest('[data-action]');
  if (!a) return;
  const act = a.dataset.action;
  const host = a.closest('[data-id]');
  const id = host?.dataset.id;

  switch (act) {
    case 'toggle': return tapToggle(host, id);
    case 'edit':
      if (S.shop) return tapToggle(host, id);
      return openItemSheet(id);
    case 'open-add': return openItemSheet();
    case 'close-sheet': return closeSheet();
    case 'add-more': return submitItem({ more: true });
    case 'add-mode': return setAddMode(a.dataset.mode);
    case 'cat-tab': S.catTab = a.dataset.tab; S.catQuery = ''; $('#catSearch').value = ''; refreshCatalog(); $('#catalogGrid').scrollTop = 0; return;
    case 'tile': return pickTile(a.dataset.key);
    case 'tile-plus': return stepTile(a.closest('.tile').dataset.key, 1);
    case 'tile-minus': return stepTile(a.closest('.tile').dataset.key, -1);
    case 'tile-new': return pickNew();
    case 'pick-add': return addPicked();
    case 'pick-clear': S.pick.clear(); refreshCatalog(); return;
    case 'delete-item': { const eid = S.editing; closeSheet(); if (eid) deleteItem(eid); return; }
    case 'step': return stepQty(Number(a.dataset.dir));
    case 'unit': S.form.unit = a.dataset.unit; renderUnits(); return;
    case 'cat': S.form.cat = a.dataset.cat; S.form.catTouched = true; renderCats(); return;
    case 'sug': {
      const s = S.sugs.find((x) => x.id === a.dataset.key);
      if (!s) return;
      $('#fName').value = s.name;
      if (s.category && CAT[s.category]) { S.form.cat = s.category; S.form.catTouched = true; }
      if (s.unit && UNITS.includes(s.unit)) S.form.unit = s.unit;
      renderCats(); renderUnits(); renderSuggestions();
      return;
    }
    case 'filter': S.filter = a.dataset.cat; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); return;
    case 'mode': {
      const shop = a.dataset.mode === 'shop';
      if (shop === S.shop) return;
      S.shop = shop; ls.set('mq.shop', shop); applyMode(true);
      return;
    }
    case 'search': {
      const bar = $('#searchBar');
      bar.hidden = !bar.hidden;
      if (!bar.hidden) $('#searchInput').focus();
      else { S.query = ''; $('#searchInput').value = ''; render(); }
      return;
    }
    case 'search-close': $('#searchBar').hidden = true; S.query = ''; $('#searchInput').value = ''; render(); return;
    case 'toggle-bought': S.boughtOpen = !S.boughtOpen; ls.set('mq.boughtOpen', S.boughtOpen); render(); return;
    case 'archive-bought': return archiveBought();
    case 'clear-bought': return clearBought();
    case 'menu': return openMenu();
    case 'open-archive': return openArchive();
    case 'restore': return restoreFromArchive(id, host);
    case 'pick-name': return enterApp(a.dataset.name);
    case 'change-name': closeSheet(); setWake(false); return showWho();
    case 'share-link': return shareLink();
    case 'connect': {
      const btn = a, input = $('#tokenInput'), err = $('#tokenErr');
      const token = input.value.trim();
      if (!KEY_RE.test(token)) { err.textContent = 'ألصق المفتاح كاملاً. يبدأ بـ github_pat_'; return; }
      btn.disabled = true; btn.textContent = 'جارٍ التحقق…'; err.textContent = '';
      checkToken(token).then((r) => {
        if (!r.ok) { err.textContent = r.msg; return; }
        if (!r.isPrivate) alert(`تنبيه: المستودع ${DATA_REPO} عام، يعني أي أحد يقدر يقرأ المقاضي. خلّه Private من إعداداته.`);
        ls.set('mq.token', token);
        location.hash = 't=' + token;
        location.reload();
      }).catch(() => { err.textContent = 'تعذّر الاتصال بـ GitHub. تحقق من الإنترنت.'; })
        .finally(() => { btn.disabled = false; btn.textContent = 'ربط القائمة'; });
      return;
        }
  }
}

function tapToggle(li, id) {
  if (!li || li.dataset.busy) return;
  const it = byId(id);
  if (!it) return;
  li.dataset.busy = '1';
  li.classList.add(it.bought ? 'unpop' : 'pop');
  setTimeout(() => toggleBought(id), 230);
}

// ---------- تكيّف مع لوحة مفاتيح iPhone ----------
function fitViewport() {
  const vv = window.visualViewport;
  const root = document.documentElement.style;
  const update = () => {
    if (!vv) return;
    const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    root.setProperty('--kb', kb + 'px');
    root.setProperty('--vvh', vv.height + 'px');
  };
  if (vv) { vv.addEventListener('resize', update); vv.addEventListener('scroll', update); }
  update();
}
